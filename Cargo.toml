[package]
name = "slint-mcu-rust-template"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
slint = { version = "1.19", default-features = false, features = ["compat-1-2", "renderer-software"] }

# for the rp-pico, replace by the hal for your crate
rp-pico = { version = "0.9", optional = true }
cortex-m = { version = "0.7.6", optional = true }
cortex-m-rt = { version = "0.7.1", optional = true }
embedded-alloc = { version = "0.7", optional = true }
mipidsi = { version = "0.10", optional = true }
panic-halt = { version = "1.0", optional = true }
embedded-graphics-core = { version = "0.4", optional = true }
embedded-hal = { version = "1.0", optional = true }
fugit = { version = "0.3.6", optional = true }

[build-dependencies]
slint-build = { version = "1.19" }


[features]
simulator = ["slint/backend-winit"]
pico = [
    "slint/unsafe-single-threaded",
    "slint/libm",
    "rp-pico",
    "cortex-m",
    "cortex-m-rt",
    "embedded-alloc",
    "embedded-hal",
    "fugit",
    "mipidsi",
    "embedded-graphics-core",
    "panic-halt"
]

